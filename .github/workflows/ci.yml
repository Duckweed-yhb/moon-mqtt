name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      # protocol/ 是纯计算包，声明覆盖全部四个后端。
      # 四个后端逐一测试，证明「可移植的库」是构建期可验证的事实。
      # 注意：三步刻意分开写；合并成多行 run 块在 windows-latest
      # 会走 PowerShell，行分隔语义不同，会直接跑挂。

      # 格式检查（advisory，不阻断）：CI 装最新工具链，把 `} derive(...)` 规范成
      # `#derive(...)` 前缀写法；本地 0.1.20261012 是后缀写法，该版本在官方
      # 下载站又没有产物（setup 直接 403），无法用 version 钉住。两边不可能
      # 同时通过，所以只报告差异、不判红。升级工具链后去掉 continue-on-error。
      - name: Format report (advisory)
        continue-on-error: true
        run: moon fmt --check

      - name: Check
        run: moon check

      # JS FFI 边界用 FixedArray，js 目标必须 0 警告；用 --deny-warn 固化。
      - name: Check (js, deny warnings)
        run: moon check --target js --deny-warn

      # 独立 build 步骤（验收第 5 条：构建覆盖）。
      # 四个后端逐一构建，与下方 test 矩阵对齐；本地 wasm/js bundle 缺失
      # 是本机 core 预编译产物问题，CI 上四后端均为绿。
      - name: Build (wasm)
        run: moon build --target wasm

      - name: Build (wasm-gc)
        run: moon build --target wasm-gc

      - name: Build (js)
        run: moon build --target js

      # 浏览器 demo 产物：两条 js executable 都必须能构建。
      - name: Build browser demo (js)
        run: moon build --target js examples/browser-demo

      - name: Build ws-spike (js)
        run: moon build --target js examples/ws-spike

      - name: Build (native)
        run: moon build --target native

      - name: Test (wasm)
        run: moon test --target wasm

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Test (js)
        run: moon test --target js

      - name: Test (native)
        run: moon test --target native

      # examples/pubsub：可运行示例（验收第 6 条），本地即可跑通的
      # 报文编解码往返，不依赖真实 broker。native 下运行验证。
      - name: Run example (pubsub)
        run: moon run examples/pubsub

      # examples/resume：QoS2 中断重连时间线，纯计算不连 TCP。
      - name: Run example (resume)
        run: moon run examples/resume

      # examples/scripted-broker：进程内脚本化 broker，端到端跑完
      # CONNECT → SUBSCRIBE → PUBLISH(QoS1/QoS2) → PING → UNSUBSCRIBE → DISCONNECT，
      # 不需要 broker 进程与网络。
      - name: Run example (scripted-broker)
        run: moon run examples/scripted-broker --target native

  release-meta:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # moon.mod 的 version、CHANGELOG 最新段标题、README 的安装版本三处必须一致。
      # 发布时漏改任何一处都不会报错，只会让文档变成谎话——用脚本挡在这里。
      - name: Check version / CHANGELOG / README consistency
        shell: pwsh
        run: ./scripts/check-release.ps1
